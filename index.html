<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>chubby chunklet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&family=Rubik:wght@400;500;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --endpoint: https://pu30nzsu59.execute-api.us-east-1.amazonaws.com/dev/chunklet;

    /* Figure + face */
    --figure-scale: 0.80;
    --mouth-top:60%;
    --mouth-left:47%;
    --mouth-w:20px;
    --mouth-h:20px;
    --mouth-scale-0:.08;

    --eye-top:34.2%;
    --eye-gap:18px;
    --eye-size:4px;

    --char-ms:18;

    /* Doorway = the figure's registered bbox (clock re-scaled a bit smaller on the canvas) */
    --door-x: 0.502;
    --door-y: 0.400;
    --door-w: 0.027;
    --door-h: 0.072;

    /* Little red "call" button in the middle of the clock (detected dial centre) */
    --btn-x: 0.502;
    --btn-y: 0.514;

    /* Clip-frame sizing + figure placement inside it (sprite already = only the visible part) */
    --win-grow: 1.18;  /* a little taller than the bbox so the pop-in isn't clipped */
    --win-shift: 0;    /* move the clip-frame up/down (fraction of opening height; neg = up) */
    --peg-w: 100%;     /* sprite fills the frame width → registers exactly with the empty doorway */
    --peg-top: 0%;     /* vertical nudge of the figure inside the frame */

    --bubble-gap: 18px;
    --tail-x: 50%;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;
    font-family:Rubik, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background:#000;color:#fff; -webkit-font-smoothing:antialiased;
    overflow:hidden; height:100%; width:100%;
  }

  /* INTRO */
  .intro-overlay{position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:#4a7ba7; cursor:pointer;}
  .intro-bg{position:absolute; inset:0; background:url('introscreen.png') center/cover no-repeat #4a7ba7;}
  @media (orientation: portrait) and (max-width: 900px) {
    .intro-bg{ background-image: url('introscreen_portrait.png'); }
  }

  /* Scene */
  .scene-container{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#4a7ba7; }
  .scene-bg{ width:100%; height:100%; position:relative; display:flex; align-items:center; justify-content:center; perspective:900px; }
  .scene-bg img{ width:100%; height:100%; object-fit:cover; display:block; user-select:none; -webkit-user-drag:none; }

  /* Invisible click hotspot over the clock's little door */
  .door-container{ position:absolute; left:50%; top:52%; width:140px; height:180px; transform:translate(-50%, -50%); cursor:pointer; z-index:50; }

  /* Black doorway: sits over the opening (covering the painted figure). The peg lives INSIDE
     it and is clipped to the opening, so he appears in that spot — not below on the clock face. */
  /* Transparent clip frame at the doorway — the background already shows the dark recess,
     so this just clips the peg's body to the opening. */
  .cuckoo-window{ position:absolute; overflow:hidden; background:transparent; z-index:55; pointer-events:none;
                  transform:translate(-50%,-50%); }

  /* Chunklet peg, inside the black window. --peg-w = his width relative to the window (bigger fills
     more); --peg-top nudges him vertically. The window's overflow:hidden clips his body to the doorway. */
  .peg-fig{ position:absolute; left:50%; top:var(--peg-top); width:var(--peg-w); transform:translateX(-50%);
            opacity:0; transition:opacity .2s ease; z-index:60; pointer-events:none; }
  .peg-fig.active{ animation:pegPop .5s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes pegPop{
    0%{   opacity:0; transform:translateX(-50%) translateY(26%) scale(.9); }
    60%{  opacity:1; transform:translateX(-50%) translateY(0)    scale(1); }
    100%{ opacity:1; transform:translateX(-50%) translateY(0)    scale(1); }
  }
  .peg-img{ width:100%; display:block; user-select:none; -webkit-user-drag:none; image-rendering:-webkit-optimize-contrast; }
  /* Animating mouth on his (blank) lower face — fixed fraction of the sprite. */
  .peg-mouth{ position:absolute; top:31.4%; left:43.3%; width:16%; height:11%; transform:translate(-50%,-50%); pointer-events:none; }
  #mouth{ transform-origin:50% 50%; transform:scale(1, var(--mouth-scale-0)); stroke:#000; stroke-width:1.4px; }
  /* His eyes are painted on the sprite — hide the overlay dots (kept in DOM only for the JS refs). */
  .eyes-overlay{ position:absolute; top:0; left:0; width:0; height:0; }
  .eye-dot{ display:none; }

  /* Bubble */
  /* Comic-book speech bubble, pinned near the bottom with the tail pointing up at the clock. */
  .output-container{ position:fixed; left:50%; transform:translateX(-50%); width:auto; max-width:min(90vw, 540px); z-index:40; opacity:0; transition:opacity 0.35s; pointer-events:none; text-align:center; }
  .output-container.active{ opacity:1; }
  .bubble-wrap{ position:relative; display:inline-block; }
  .speech-bubble{ position:relative; background:#fff; border:5px solid #000; border-radius:24px; padding:11px 18px; color:#111; box-shadow:0 5px 0 #000, 0 12px 26px rgba(0,0,0,.35); display:inline-block; max-width:100%; }
  .bubble-tail{ position:absolute; bottom:-2px; left:var(--tail-x); transform:translate(-50%, 100%); width:40px; height:26px; pointer-events:none; }
  .bubble-tail.tail-top{ bottom:auto; top:-2px; transform:translate(-50%,-100%) scaleY(-1); }
  .output{ font-family:"Emilys Candy", Rubik, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; text-transform:uppercase; font-weight:400; font-size:clamp(15px, 1.8vw, 21px); line-height:1.08; letter-spacing:-0.03em; word-spacing:-0.03em; color:#111; margin:0; white-space:pre-wrap; text-align:center; }
  .cursor{ display:inline-block; width:.5ch; height:1.05em; background:#111; vertical-align:text-bottom; border-radius:2px; opacity:0; }
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  .typing .cursor{ opacity:1; animation:blink 1s steps(1,end) infinite; }
  .output .work-tag{ opacity:.95; text-transform:uppercase; margin-left:.6em; font-size:.72em; letter-spacing:-0.04em; color:#333; display:block; margin-top:10px; }

  /* Entrance animations */
  @keyframes emergePop{0%{transform:translate(-50%,-60px) scale(.86,.92) rotate(-3deg); opacity:0; filter:brightness(.85);}40%{transform:translate(-50%,-28px) scale(1.06,.94) rotate(-2deg); opacity:1;}60%{transform:translate(-50%,-18px) scale(.96,1.04) rotate(2deg);}100%{transform:translate(-50%,-12px) scale(1,1) rotate(0deg);}}
  /* Cuckoo settle: he springs out of the opening and bobs in place (no walking down). */
  @keyframes waddleDown{0%{transform:translate(-50%,-12px)}18%{transform:translate(-50%,-4px)}36%{transform:translate(-50%,-13px)}56%{transform:translate(-50%,-6px)}76%{transform:translate(-50%,-12px)}100%{transform:translate(-50%,-10px)}}
  @keyframes shadowEmerge{0%{opacity:0; transform:translateX(-50%) scale(0.4);}60%{opacity:.55; transform:translateX(-50%) scale(0.75);}100%{opacity:.65; transform:translateX(-50%) scale(0.85);}}
  @keyframes shadowWaddle{0%{opacity:.65; transform:translateX(-50%) scale(0.85);}25%{opacity:.70; transform:translateX(-50%) scale(0.95);}50%{opacity:.60; transform:translateX(-50%) scale(0.88);}75%{opacity:.72; transform:translateX(-50%) scale(1.00);}100%{opacity:.68; transform:translateX(-50%) scale(1.05);}}
  .chunklet-container.emerge{animation:emergePop .7s cubic-bezier(.22,1,.36,1) forwards;}
  .chunklet-container.waddle{animation:waddleDown 2.4s cubic-bezier(.22,1,.36,1) forwards;}
  .chunklet-container.emerge .ground-shadow{animation:shadowEmerge .7s ease-out forwards;}
  .chunklet-container.waddle .ground-shadow{animation:shadowWaddle 2.4s ease-out forwards;}

  /* Context card */
  .context-container{ position:fixed; left:50%; transform:translateX(-50%); top:8px; z-index:70; pointer-events:none; opacity:0; transition:opacity .35s ease; width:calc(100vw - 24px); max-width:760px; padding:0 6px; }
  .context-container.active{ opacity:1; }
  .tweet-card{
    background:#0f172a; color:#e5e7eb;
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px; padding:12px 14px;
    box-shadow:0 8px 28px rgba(0,0,0,.35);
    font: 400 15px/1.45 "DM Sans", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  .tweet-text{ letter-spacing:.01em; }

  /* Glasses toggle button — fixed near Chunklet, not the bubble */
  .glasses-btn{
    position:fixed;
    z-index:95; /* keep above everything */
    width:64px; height:64px; border:0; background:transparent; padding:0; display:none;
    transform:translate(-50%,-50%);
    pointer-events:auto;
  }
  .glasses-btn img{ width:100%; height:100%; display:block; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
  .glasses-btn.show{ display:block; }

  /* Little red "call" button in the middle of the clock + black flashing arrow */
  .hidden{ display:none !important; }
  .red-btn{ position:absolute; z-index:85; width:20px; height:20px; padding:0; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #ff7264 0%, #e02414 55%, #a5100a 100%);
    border:2px solid #6e0b05; box-shadow:0 2px 4px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.55);
    transform:translate(-50%,-50%); cursor:pointer; animation:redPulse 1.15s ease-in-out infinite; }
  .red-btn:active{ transform:translate(-50%,-50%) scale(.88); }
  @keyframes redPulse{
    0%,100%{ box-shadow:0 2px 4px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.55), 0 0 0 0 rgba(224,36,20,.55); }
    50%{     box-shadow:0 2px 4px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.55), 0 0 0 7px rgba(224,36,20,0); }
  }
  .red-arrow{ position:absolute; z-index:85; transform:translate(-50%,-50%); pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.4)); animation:arrowFlash .58s steps(1,end) infinite; }
  .red-arrow .hand-img{ display:block; width:30px; height:auto; image-rendering:pixelated; }
  @keyframes arrowFlash{ 0%,49%{ opacity:1; transform:translate(-50%,-50%) translateY(0); } 50%,100%{ opacity:.15; transform:translate(-50%,-50%) translateY(5px); } }

  /* Mobile (portrait-first) */
  @media (max-width: 600px) {
    :root{
      --figure-scale:.60;
      --mouth-w:16px;
      --mouth-h:16px;
      --mouth-top:59%;
      --mouth-left:47%;

      --eye-top:33.8%;
      --eye-gap:14px;
      --eye-size:3.4px;

      --bubble-gap:10px;
    }

    .tweet-card{ padding:10px 12px; font-size:14px; line-height:1.45; }
    .output{ font-size:clamp(17px, 4.7vw, 22px); letter-spacing:-0.045em; }
    .speech-bubble{ border-width:5px; border-radius:26px; padding:12px 14px; }
    .bubble-tail{ width:36px; height:24px; }
    .glasses-btn{ width:58px; height:58px; }
  }
</style>

<body>

<div class="intro-overlay" id="intro" aria-label="Tap to start">
  <div class="intro-bg" aria-hidden="true"></div>
</div>

<!-- Single persistent audio element for ALL sounds (click + TTS) -->
<audio id="mainPlayer" src="click.mp3" preload="auto" playsinline webkit-playsinline></audio>

<div class="scene-container" id="gameRoot" aria-hidden="true">
  <div class="scene-bg">
    <img src="cuckoo.png" alt="Scene background" />

    <!-- Invisible click hotspot over the clock's little door -->
    <div class="door-container" id="doorTrigger" aria-label="Open the door" role="button" tabindex="0"></div>

    <!-- Black doorway: covers the painted figure; the peg appears INSIDE it (clipped to the opening) -->
    <div class="cuckoo-window" id="cuckooWindow" aria-hidden="true">
      <div class="peg-fig" id="chunkletContainer">
        <img src="peg.png" alt="Chubby Chunklet" class="peg-img" />
        <svg class="peg-mouth" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse id="mouth" cx="50" cy="50" rx="26" ry="24" fill="#111"/>
        </svg>
        <div class="eyes-overlay" id="eyes">
          <div class="eye-dot eye-left"></div>
          <div class="eye-dot eye-right"></div>
        </div>
      </div>
    </div>

    <!-- Little red "call" button in the middle of the clock + a black flashing arrow -->
    <div class="red-arrow hidden" id="redArrow" aria-hidden="true">
      <img src="hand.png" alt="" class="hand-img" />
    </div>
    <button class="red-btn hidden" id="redBtn" type="button" aria-label="Wake him up"></button>
  </div>
</div>

<!-- quote bubble -->
<div class="output-container" id="outputContainer" aria-live="polite">
  <div class="bubble-wrap">
    <div class="speech-bubble" id="bubble">
      <div class="output" id="output">
        <span id="typed"></span><span id="cursor" class="cursor"></span>
      </div>
    </div>
    <svg class="bubble-tail" id="bubbleTail" viewBox="0 0 44 28" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path d="M4,2 C 14,20 30,20 40,2" fill="#fff" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<!-- context -->
<div class="context-container" id="ctx">
  <div class="tweet-card">
    <div class="tweet-text" id="ctxText"></div>
  </div>
</div>

<!-- toggle -->
<button id="glassesBtn" class="glasses-btn" aria-label="Toggle note">
  <img src="glasses.png" alt="">
</button>

<div class="cal-hud" id="calHud"></div>

<!-- Kokoro neural TTS (client-side, free, no key). Lazy-loads on first use; if anything
     fails the app falls back to the browser voice, so this can never break the page. -->
<script type="module">
  window.__kokoro = { ready:false, loading:false, tts:null, error:null };
  window.loadKokoro = async function(){
    const k = window.__kokoro;
    if (k.ready || k.loading) return;
    k.loading = true;
    try {
      const mod = await import("https://esm.sh/kokoro-js@1.2.0");
      const KokoroTTS = mod.KokoroTTS || (mod.default && mod.default.KokoroTTS);
      const webgpu = ('gpu' in navigator);
      k.tts = await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", {
        dtype: webgpu ? "fp32" : "q8",
        device: webgpu ? "webgpu" : "wasm",
      });
      k.ready = true;
      console.log("Kokoro voice ready (" + (webgpu ? "webgpu" : "wasm") + ")");
    } catch (e) {
      k.error = e; console.warn("Kokoro load failed; using browser voice:", e);
    } finally { k.loading = false; }
  };
  window.kokoroGenerate = async function(text, voice){
    const k = window.__kokoro;
    if (!k.ready || !k.tts) return null;
    const audio = await k.tts.generate(text, { voice: voice || "bm_george" });
    return audio.toBlob(); // WAV Blob
  };
</script>

<script>
(() => {
  const css = getComputedStyle(document.documentElement);
  const ENDPOINT = (css.getPropertyValue('--endpoint') || '').trim() ||
    'https://pu30nzsu59.execute-api.us-east-1.amazonaws.com/dev/chunklet';

  // Snippet-specific context via the free Cloudflare Worker (see context-worker/README.md).
  // Paste your deployed Worker URL here; leave "" to just use the Wikipedia fallback.
  const CONTEXT_ENDPOINT = "https://chunklet-context.kevin-murawinski.workers.dev";

  const IS_PHONE = window.matchMedia('(max-width: 600px)').matches;

  // Phase 1: fast quote + context (no TTS)
  const QUERY_QUOTE = '?only_quote=1&style=canon&modern=0&context=1';
  const QUERY_QUOTE_FALLBACK = '?style=canon&modern=0&context=1&tts=0';
  // Phase 2: TTS for whatever text we displayed
  const buildTTS = (t)=> `?only_tts=1&accent=scottish&voice=fable&text=${encodeURIComponent(t)}`;

  const CHAR_MS  = parseInt(css.getPropertyValue('--char-ms'),10) || 20;

  const DOOR_SWING_MS = 800, EMERGE_MS = 700, WADDLE_MS = 2400;
  const SHOW_CTX_AFTER_MS = 700;
  const BUBBLE_LINGER_MS  = 50000;
  const CTX_LINGER_MS     = 50000;

  const BLINK_MIN = 2600, BLINK_MAX = 5400;

  // How fast he talks. Lower = slower, so you actually see the mouth open AND fully close on
  // each word (instead of a fast blah-blah flap). Drives both the browser voice and the mouth.
  const SPEAK_RATE = 0.58;

  const intro = document.getElementById('intro');
  const gameRoot = document.getElementById('gameRoot');

  const doorTrigger       = document.getElementById('doorTrigger');
  const cuckooWindow      = document.getElementById('cuckooWindow');
  const chunkletContainer = document.getElementById('chunkletContainer');
  const outputContainer   = document.getElementById('outputContainer');
  const typed             = document.getElementById('typed');
  const cursor            = document.getElementById('cursor');
  const mouth             = document.getElementById('mouth');
  const output            = document.getElementById('output');

  const mainPlayer        = document.getElementById('mainPlayer');
  mainPlayer.crossOrigin  = 'anonymous';
  const CLICK_MP3         = 'click.mp3';

  mainPlayer.addEventListener('error', () => {
    const el = mainPlayer;
    const code = el.error && el.error.code;
    console.warn('mainPlayer error', code, el.error);
  });

  const eyesWrap = document.getElementById('eyes');
  const eyeL = eyesWrap.querySelector('.eye-left');
  const eyeR = eyesWrap.querySelector('.eye-right');

  const ctxWrap = document.getElementById('ctx');
  const ctxText = document.getElementById('ctxText');
  const bubbleTail = document.getElementById('bubbleTail');

  const bgImg   = document.querySelector('.scene-bg img');
  const hostEl  = document.querySelector('.scene-bg');

  const glassesBtn = document.getElementById('glassesBtn');
  const redBtn   = document.getElementById('redBtn');
  const redArrow = document.getElementById('redArrow');
  function showSummon(){ if(redBtn) redBtn.classList.remove('hidden'); if(redArrow) redArrow.classList.remove('hidden'); }
  function hideSummon(){ if(redBtn) redBtn.classList.add('hidden'); if(redArrow) redArrow.classList.add('hidden'); }

  let busy=false, doorOpen=false;
  let audioCtx, mediaSource, analyser, timeData;
  let raf,animating=false,tagPlaying=false;
  let currentObjectURL=null;
  let blinkTO=null;

  // iOS gesture gating
  let primed=false;
  let gestureGuardUntil = 0;

  let currentView = 'quote'; // 'quote' | 'context'
  let lastContextText = '';
  let lastTimings = []; // server lip-sync track (seconds + openness) for fallback mouth

  const sanitize = txt=>{ txt=(txt||'').trim().replace(/!+$/,'').replace(/\s+/g,' '); return /[.?!]$/.test(txt)?txt:txt+'.'; };

  /* ---- platform info ---- */
  const isiOS = /iP(hone|od|ad)/.test(navigator.userAgent);
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

  // Prefer the smoothest free voice the browser actually has (Chrome's "Google UK/US" neural-ish
  // voices, or macOS named/enhanced voices) over the flat default robotic one.
  function pickSmoothVoice(voices){
    if(!voices || !voices.length) return null;
    const byName = s => voices.find(v => (v.name||'').toLowerCase().includes(s));
    const enhancedGB = voices.find(v => /en(-|_)GB/i.test(v.lang) && /(enhanced|premium|siri|neural)/i.test(v.name||''));
    return byName('google uk english male') || byName('google uk english female')
        || byName('daniel') || byName('arthur') || byName('serena') || byName('oliver') || byName('kate')
        || byName('google us english') || byName('samantha')
        || enhancedGB
        || voices.find(v=>/en(-|_)GB/i.test(v.lang))
        || voices.find(v=>/en(-|_)US/i.test(v.lang))
        || voices.find(v=>/^en\b/i.test(v.lang)) || voices[0];
  }

  /* ---- Web Speech fallback ---- */
  function speakWithWebSpeech(text){
    return new Promise(resolve=>{
      if(!('speechSynthesis' in window)){ resolve(false); return; }

      function doSpeak(){
        const u = new SpeechSynthesisUtterance(text);
        const voices = speechSynthesis.getVoices();
        const pick = pickSmoothVoice(voices);
        if(pick) u.voice = pick;
        u.rate = SPEAK_RATE; u.pitch = 1.0; u.volume = 1.0;

        let ended=false;
        // Drive the mouth off REAL word boundaries so his jaw pops on each word actually spoken.
        u.onboundary = (e)=>{ if(!e.name || e.name==='word' || e.name==='sentence') pulseMouth(1.15); };
        u.onstart = ()=>{ pulseMouth(1.0); };
        u.onend = ()=>{ if(!ended){ ended=true; resolve(true); } };
        u.onerror = ()=>{ if(!ended){ ended=true; resolve(false); } };

        const approx = Math.max(2.4, Math.min(18, text.length/(14*SPEAK_RATE)));
        setTimeout(()=>{ if(!ended){ ended=true; resolve(true); } }, approx*1000 + 600);

        try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }
        catch(_){ resolve(false); }
      }

      // Safari sometimes populates voices async
      const voicesNow = speechSynthesis.getVoices();
      if (voicesNow && voicesNow.length){ doSpeak(); }
      else{
        const to = setTimeout(doSpeak, 300);
        speechSynthesis.addEventListener('voiceschanged', ()=>{ clearTimeout(to); doSpeak(); }, { once:true });
      }
    });
  }

  /* ---- AUDIO / ANALYSER ---- */
  function ensureCtx(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
  function ensureAnalyser(){ ensureCtx(); if(!analyser){ analyser=audioCtx.createAnalyser(); analyser.fftSize=256; analyser.smoothingTimeConstant=0.0; timeData=new Float32Array(analyser.fftSize);} }

  function attachAnalyserToMediaElement(){
    ensureAnalyser();
    if(!mediaSource && audioCtx && mainPlayer){
      try{
        mediaSource = audioCtx.createMediaElementSource(mainPlayer);
        mediaSource.connect(analyser);
        analyser.connect(audioCtx.destination);
      }catch(e){ console.warn('media element source failed', e); }
    }
  }

  function unlockAudio(){
    try{
      ensureCtx();
      if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
      attachAnalyserToMediaElement();
      // gesture-safe tiny silent beep
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0;
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.02);
    }catch(_){}
    // iOS: unlock speechSynthesis INSIDE the tap gesture. Later on, speak() runs after
    // an await fetchQuote(), by which point user activation has expired and iOS silently
    // refuses to speak — unless the engine was already invoked during a gesture. A muted
    // empty utterance here does exactly that, with no audible sound.
    try{
      if('speechSynthesis' in window){
        const warm = new SpeechSynthesisUtterance(' ');
        warm.volume = 0;
        speechSynthesis.cancel();
        speechSynthesis.speak(warm);
      }
    }catch(_){}
  }

  function typeOut(text, done){
    if(!outputContainer.classList.contains('active')){
      outputContainer.classList.add('active');
    }
    typed.textContent='';
    output.classList.add('typing');
    (function loop(i=0){
      typed.textContent = text.slice(0,i);
      placeBubble(); placeGlasses();
      if(i<text.length){
        setTimeout(()=>loop(i+1), CHAR_MS + ((i%7)?0:Math.random()*10));
      }else{
        output.classList.remove('typing');
        placeBubble(); placeGlasses();
        done && done();
      }
    })();
  }

  // mouth anim thresholds
  const SY=[0.10,0.58,1.12,1.72,2.34], SX=[1.00,1.01,1.02,1.02,1.03];
  const THRESH_UP=[0.030,0.060,0.100,0.160], HYST_DELTA=0.018;
  const THRESH_DOWN=THRESH_UP.map(t=>Math.max(0,t-HYST_DELTA));
  const GATE_FLOOR=0.010, CLOSE_GRACE_MS=20;
  let level=0,lastChange=0;

  function rmsLevel(){ if(!analyser||!timeData) return 0; analyser.getFloatTimeDomainData(timeData); let s=0; for(let i=0;i<timeData.length;i++){s+=timeData[i]*timeData[i]} let r=Math.sqrt(s/timeData.length); return r<GATE_FLOOR?0:r; }
  function setLevel(n){ n=Math.max(0,Math.min(4,n|0)); if(n===level) return; level=n; mouth.style.transform=`scale(${SX[level]}, ${SY[level]})`; lastChange=performance.now(); }
  function setClosed(){ setLevel(0); }
  function startMouth(){ if(animating) return; animating=true; raf=requestAnimationFrame(tick); }
  function stopMouth(){ animating=false; cancelAnimationFrame(raf); setClosed(); }

  // Force the mouth shut and clear inline eye transforms so blinking works again after talking.
  function forceCloseMouth(){
    level=0;
    mouth.style.transform = `scale(${SX[0]}, ${SY[0]})`;
    eyeL.style.transform = '';
    eyeR.style.transform = '';
  }
  // Fallback lip-sync: animate the mouth from the server 'timings' track (t in seconds,
  // open 0..1) instead of live audio. Used when the real TTS mp3 is unavailable so
  // Chunklet doesn't look frozen while the browser voice speaks.
  function animateMouthFromTimings(timings){
    animating=false; cancelAnimationFrame(raf); // make sure the analyser loop isn't fighting us
    if(!timings || !timings.length){ forceCloseMouth(); return { stop: forceCloseMouth }; }
    const dur = timings[timings.length-1].t || 0;
    const start = performance.now();
    let id;
    (function frame(){
      const el = (performance.now()-start)/1000;
      if(el >= dur){ forceCloseMouth(); return; }
      let i=0; while(i<timings.length && timings[i].t <= el) i++;
      const a = timings[Math.max(0,i-1)], b = timings[Math.min(timings.length-1,i)];
      const span = Math.max(1e-4, b.t - a.t);
      const f = Math.max(0, Math.min(1, (el - a.t)/span));
      const open = a.open + (b.open - a.open)*f;
      const sy = SY[0] + open*(SY[4]-SY[0]);
      const sx = 1.00 + open*0.03;
      mouth.style.transform = `scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
      const es = 1 - Math.min(0.22, open*0.18);
      eyeL.style.transform = `translate(-50%,-50%) scaleY(${es.toFixed(3)})`;
      eyeR.style.transform = `translate(-50%,-50%) scaleY(${es.toFixed(3)})`;
      id = requestAnimationFrame(frame);
    })();
    return { stop: ()=>{ cancelAnimationFrame(id); forceCloseMouth(); } };
  }

  // Talking mouth. BEST: pop the jaw on REAL word boundaries from the browser voice (synced to
  // what you actually hear), decaying fully SHUT between words. Falls back to the server 'timings'
  // track (slowed) only if boundary events never fire; last resort a gentle gabber.
  let talkRAF=null, mouthEnergy=0, pulseCount=0;
  function pulseMouth(strength){ mouthEnergy = Math.min(1.25, Math.max(mouthEnergy, strength||1)); pulseCount++; }
  function startTalkMouth(timings){
    stopTalkMouth();
    animating=false; cancelAnimationFrame(raf);
    mouthEnergy=0; pulseCount=0;
    const start=performance.now(); let prev=start;
    const hasT = timings && timings.length;
    const dur = hasT ? (timings[timings.length-1].t||0) : 0;
    // Discrete mouth LEVELS + hard GATE so the mouth fully CLOSES between words (mouths the words).
    const GATE=0.12, CLOSE_MS=130;         // shorter = snappier, tighter to each word (less lag)
    const TH_UP=[0.16,0.42,0.68,0.88], HYST=0.05;
    const TH_DN=TH_UP.map(t=>Math.max(0,t-HYST));
    (function frame(){
      const now=performance.now();
      const dt=Math.min(0.05,(now-prev)/1000); prev=now;
      let open;
      if(pulseCount>=2){
        // word-boundary driven: each word snaps the jaw open, then it decays fully shut fast
        mouthEnergy = Math.max(0, mouthEnergy - dt*1000/CLOSE_MS);
        const flutter = 0.5 + 0.5*Math.sin((now-start)/1000 * (2*Math.PI) * 5.5);
        open = mouthEnergy * (0.85 + 0.15*flutter);   // mostly the envelope, tiny flutter
      } else {
        const t=((now-start)/1000) * SPEAK_RATE;   // slowed to match the voice
        if(hasT && t<=dur){
          let i=0; while(i<timings.length && timings[i].t<=t) i++;
          const a=timings[Math.max(0,i-1)], b=timings[Math.min(timings.length-1,i)];
          const span=Math.max(1e-4,b.t-a.t), f=Math.max(0,Math.min(1,(t-a.t)/span));
          open=a.open+(b.open-a.open)*f;
        } else {
          open = Math.abs(Math.sin(t*7.0)) * (0.5 + 0.5*Math.abs(Math.sin(t*2.3)));
        }
      }
      open=Math.max(0,Math.min(1,open));
      let target;
      if(open < GATE){ target=0; }
      else{
        target=level;
        while(target<4 && open>=TH_UP[target]) target++;
        while(target>1 && open<TH_DN[target-1]) target--;
        if(target<1) target=1;
      }
      setLevel(target);
      talkRAF = requestAnimationFrame(frame);
    })();
  }
  function stopTalkMouth(){ if(talkRAF){ cancelAnimationFrame(talkRAF); talkRAF=null; } mouthEnergy=0; pulseCount=0; forceCloseMouth(); }

  function tick(){
    if(!animating) return; raf=requestAnimationFrame(tick);
    if(tagPlaying){
      if(analyser && mediaSource){
        const e=rmsLevel();
        let target=level;
        const now=performance.now();
        while(target<4 && e>=THRESH_UP[target]) target++;
        while(target>0 && e<THRESH_DOWN[target-1]) target--;
        if(target<level && (now-lastChange)<CLOSE_GRACE_MS) target=level;
        setLevel(target);
        const speakScale = 1 - Math.min(0.22, level*0.04);
        eyeL.style.transform = `translate(-50%,-50%) scaleY(${speakScale})`;
        eyeR.style.transform = `translate(-50%,-50%) scaleY(${speakScale})`;
      } else {
        setClosed();
      }
      return;
    }
    setClosed();
  }

  const DOOR={
    get x(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--door-x'))||0.5; },
    get y(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--door-y'))||0.55; },
    get w(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--door-w'))||0.10; },
    get h(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--door-h'))||0.25; }
  };

  function positionDoorAndChunklet(){
    const hostRect=hostEl.getBoundingClientRect();
    const natW=bgImg.naturalWidth, natH=bgImg.naturalHeight;

    const scale = (natW&&natH) ? Math.max(hostRect.width/natW, hostRect.height/natH) : 1;
    const dispW = (natW||hostRect.width)*scale;
    const dispH = (natH||hostRect.height)*scale;
    const offsetX=(hostRect.width-dispW)/2, offsetY=(hostRect.height-dispH)/2;

    const cx = hostRect.left + offsetX + dispW*DOOR.x;
    const cy = hostRect.top  + offsetY + dispH*DOOR.y;
    const dw = dispW*DOOR.w, dh = dispH*DOOR.h;

    const L = (cx-hostRect.left), T = (cy-hostRect.top);
    Object.assign(doorTrigger.style, { left:L+'px', top:T+'px', width:dw+'px', height:dh+'px' });

    // Clip-frame over the opening; shift up so his body is cut at the arch, not on the clock face.
    const cs = getComputedStyle(document.documentElement);
    const grow  = parseFloat(cs.getPropertyValue('--win-grow'))||1;
    const shift = parseFloat(cs.getPropertyValue('--win-shift'))||0;
    Object.assign(cuckooWindow.style, { left:L+'px', top:(T + shift*dh)+'px', width:dw+'px', height:(dh*grow)+'px' });

    // Little red call-button in the middle of the clock, with the black arrow just below it.
    const bx = offsetX + dispW*(parseFloat(cs.getPropertyValue('--btn-x'))||0.5);
    const by = offsetY + dispH*(parseFloat(cs.getPropertyValue('--btn-y'))||0.52);
    if(redBtn)   Object.assign(redBtn.style,   { left:bx+'px', top:by+'px' });
    if(redArrow) Object.assign(redArrow.style, { left:bx+'px', top:(by+30)+'px' });

    placeBubble(); placeGlasses();
  }

  function placeBubble(){
    const cardRect = outputContainer.getBoundingClientRect();
    const guyRect  = chunkletContainer.getBoundingClientRect();
    if(!cardRect.width) return;
    // Sit the bubble in the lower-middle (not glued to the very bottom); tail points up at him.
    let top = Math.round(window.innerHeight * 0.44);
    const maxTop = window.innerHeight - cardRect.height - 12;
    if(top > maxTop) top = maxTop;                // don't overflow the bottom
    outputContainer.style.top = Math.max(8, top) + 'px';
    if(bubbleTail) bubbleTail.classList.add('tail-top');
    if(guyRect.width){
      const tailPx = (guyRect.left + guyRect.width/2) - cardRect.left;
      const tailPct = Math.max(12, Math.min(88, tailPx / Math.max(1,cardRect.width) * 100));
      outputContainer.style.setProperty('--tail-x', tailPct + '%');
    }
  }

  // GLASSES ("3D shades"): fixed bottom-right corner — the tap-for-context toggle.
  function placeGlasses(){
    const btnW = IS_PHONE ? 58 : 64;
    glassesBtn.style.left = (window.innerWidth  - btnW/2 - 12) + 'px';
    glassesBtn.style.top  = (window.innerHeight - btnW/2 - 12) + 'px';
  }

  new ResizeObserver(()=>{ placeBubble(); placeGlasses(); }).observe(outputContainer);
  function onReadyToPosition(){
    positionDoorAndChunklet();
    setTimeout(positionDoorAndChunklet, 50);
    setTimeout(positionDoorAndChunklet, 250);
  }
  if(bgImg.complete) onReadyToPosition(); else bgImg.addEventListener('load', onReadyToPosition);
  window.addEventListener('resize', positionDoorAndChunklet);
  window.addEventListener('orientationchange', positionDoorAndChunklet);

  function openDoor(){
    if(doorOpen) return;
    positionDoorAndChunklet();
    doorOpen=true;
    // No doors — he simply appears in the black doorway.
    chunkletContainer.classList.add('active');
    setTimeout(()=>{ placeBubble(); placeGlasses(); }, 60);
  }
  function closeDoor(){
    if(!doorOpen) return; doorOpen=false;
    chunkletContainer.classList.remove('active');
    outputContainer.classList.remove('active');
    ctxWrap.classList.remove('active');
    glassesBtn.classList.remove('show');
    clearWorkTag();
    setTimeout(()=>{ busy=false; showSummon(); }, 500);
  }

  function scheduleBlink(){
    clearTimeout(blinkTO);
    const ms = Math.round(BLINK_MIN + Math.random()*(BLINK_MAX-BLINK_MIN));
    blinkTO = setTimeout(()=>{
      eyeL.classList.add('blink'); eyeR.classList.add('blink');
      setTimeout(()=>{ eyeL.classList.remove('blink'); eyeR.classList.remove('blink'); scheduleBlink(); }, 120);
    }, ms);
  }

  // tiny WAV beep generator (fallback if click.mp3 missing)
  function makeBeepURL(freq=1100, duration=0.07, sampleRate=44100){
    const samples = Math.floor(duration * sampleRate);
    const buffer  = new ArrayBuffer(44 + samples * 2);
    const view    = new DataView(buffer);
    function writeStr(off, s){ for (let i=0;i<s.length;i++) view.setUint8(off+i, s.charCodeAt(i)); }
    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + samples*2, true);
    writeStr(8, 'WAVE');
    writeStr(12,'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1,  true);
    view.setUint16(22, 1,  true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2,  true);
    view.setUint16(34, 16, true);
    writeStr(36,'data');
    view.setUint32(40, samples*2, true);
    let offset = 44;
    for (let i=0;i<samples;i++){
      const t = i / sampleRate;
      const amp = Math.sin(2 * Math.PI * freq * t) * 0.35;
      view.setInt16(offset, (amp * 0x7FFF) | 0, true);
      offset += 2;
    }
    const blob = new Blob([buffer], {type:'audio/wav'});
    return URL.createObjectURL(blob);
  }

  async function playClickOrBeep(){
    if(currentObjectURL){ URL.revokeObjectURL(currentObjectURL); currentObjectURL=null; }
    try{
      mainPlayer.src = CLICK_MP3;
      mainPlayer.load();
      mainPlayer.currentTime = 0;
      await mainPlayer.play();
      return true;
    }catch(err){
      console.warn('click.mp3 failed, falling back to beep', err);
      try{
        const beepURL = makeBeepURL(1200, 0.06);
        mainPlayer.src = beepURL;
        mainPlayer.load();
        mainPlayer.currentTime = 0;
        await mainPlayer.play();
        setTimeout(()=>{ try{ URL.revokeObjectURL(beepURL); }catch(_){} }, 2000);
        return true;
      }catch(e2){
        console.warn('Beep fallback also failed', e2);
        return false;
      }
    }
  }

  // Play TTS using the persistent mainPlayer (then analyser drives mouth)
  async function playAudio(b64,onEnd){
    try{
      ensureCtx(); ensureAnalyser(); attachAnalyserToMediaElement();

      const bin=Uint8Array.from(atob(b64.split(',')[1]), c=>c.charCodeAt(0));
      const blob=new Blob([bin], {type:'audio/mpeg'}); // mp3 mime

      if(currentObjectURL){ URL.revokeObjectURL(currentObjectURL); currentObjectURL=null; }

      currentObjectURL=URL.createObjectURL(blob);
      mainPlayer.src=currentObjectURL;
      mainPlayer.load();
      mainPlayer.currentTime = 0;
      mainPlayer.volume = 1;

      // Mouth is driven by startTalkMouth() in speak(); playAudio only produces the sound.
      mainPlayer.onended= ()=>{ if(currentObjectURL){ URL.revokeObjectURL(currentObjectURL); currentObjectURL=null; } onEnd&&onEnd(); };
      mainPlayer.onerror = (e)=>{ console.warn('Audio element error', e); onEnd&&onEnd(); };

      if (audioCtx && audioCtx.state === 'suspended') { try { await audioCtx.resume(); } catch(_){} }
      await mainPlayer.play();
    }catch(err){
      console.warn('TTS play blocked/failed; using Web Speech fallback', err);
      try{ await speakWithWebSpeech(typed.textContent || ''); }catch(_){}
      onEnd && onEnd();
    }
  }
  function stopAudio(){
    try{ mainPlayer.pause(); mainPlayer.currentTime=0; }catch(_){}
    if(currentObjectURL){ URL.revokeObjectURL(currentObjectURL); currentObjectURL=null; }
    tagPlaying=false;
  }

  function showWork(work, author){
    const old = document.querySelector('#output .work-tag'); if(old) old.remove();
    if(!work && !author) return;
    const span=document.createElement('span'); span.className='work-tag';
    span.textContent='— '+[work,author].filter(Boolean).join(' · ');
    document.getElementById('output').appendChild(span);
  }
  function clearWorkTag(){ const old = document.querySelector('#output .work-tag'); if(old) old.remove(); }

  // Robust fetch with timeout
  function fetchJSONWithTimeout(url, timeoutMs){
    const ctrl = new AbortController();
    const id = setTimeout(()=>ctrl.abort('timeout'), timeoutMs);
    return fetch(url, { cache:'no-store', signal: ctrl.signal })
      .finally(()=> clearTimeout(id));
  }
  async function safeGetJSON(url, ms){
    try{
      const res = await fetchJSONWithTimeout(url, ms);
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    }catch(err){
      console.warn('safeGetJSON fail:', err);
      return null;
    }
  }
  async function fetchQuote(){
    const first = await safeGetJSON(ENDPOINT + QUERY_QUOTE, IS_PHONE ? 13000 : 9000);
    if (first && first.text) return first;
    const second = await safeGetJSON(ENDPOINT + QUERY_QUOTE_FALLBACK, IS_PHONE ? 10000 : 8000);
    return second;
  }
  async function fetchTTS(text){
    return await safeGetJSON(ENDPOINT + buildTTS(text), IS_PHONE ? 11000 : 9000);
  }

  // FREE context: pull a short blurb about the work (or author) from Wikipedia — no API key,
  // CORS-enabled. Replaces the dead OpenAI-generated context behind the glasses toggle.
  async function wikiSummary(title){
    if(!title) return '';
    try{
      const url='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title.trim().replace(/\s+/g,'_'));
      const ctrl=new AbortController(); const id=setTimeout(()=>ctrl.abort(),7000);
      const res=await fetch(url,{signal:ctrl.signal}); clearTimeout(id);
      if(!res.ok) return '';
      const j=await res.json();
      if((j.type||'').includes('disambiguation')) return '';
      return (j.extract||'').trim();
    }catch(_){ return ''; }
  }
  async function fetchWikiContext(work, author){
    let c = await wikiSummary(work);
    if(!c && author && author!==work) c = await wikiSummary(author);
    return c;
  }
  // Snippet-specific context: try the Cloudflare Worker (explains the exact line), else Wikipedia.
  async function fetchSnippetContext(q, work, author){
    if(CONTEXT_ENDPOINT){
      try{
        const u = CONTEXT_ENDPOINT + '?q='+encodeURIComponent(q||'')
                + '&work='+encodeURIComponent(work||'') + '&author='+encodeURIComponent(author||'');
        const ctrl=new AbortController(); const id=setTimeout(()=>ctrl.abort(),10000);
        const res=await fetch(u,{signal:ctrl.signal}); clearTimeout(id);
        if(res.ok){ const j=await res.json(); if(j && j.context && j.context.trim()) return j.context.trim(); }
      }catch(_){}
    }
    return await fetchWikiContext(work, author);
  }

  // Play a real audio Blob (Kokoro) through the persistent element; the analyser drives the
  // mouth off the actual waveform (tightest lip-sync — the old-chunklet path).
  function playRealAudio(blob){
    return new Promise(async (resolve)=>{
      try{
        ensureCtx(); ensureAnalyser(); attachAnalyserToMediaElement();
        if(currentObjectURL){ URL.revokeObjectURL(currentObjectURL); currentObjectURL=null; }
        currentObjectURL = URL.createObjectURL(blob);
        mainPlayer.src = currentObjectURL; mainPlayer.load(); mainPlayer.currentTime=0; mainPlayer.volume=1;
        mainPlayer.onplay = ()=>{ setClosed(); startMouth(); tagPlaying=true; };
        mainPlayer.onended = ()=>{ tagPlaying=false; stopMouth(); if(currentObjectURL){URL.revokeObjectURL(currentObjectURL);currentObjectURL=null;} resolve(); };
        mainPlayer.onerror = ()=>{ tagPlaying=false; stopMouth(); resolve(); };
        if(audioCtx && audioCtx.state==='suspended'){ try{ await audioCtx.resume(); }catch(_){} }
        await mainPlayer.play();
      }catch(e){ tagPlaying=false; stopMouth(); resolve(); }
    });
  }
  async function speakKokoro(text){
    const gen = window.kokoroGenerate(text, 'bm_george');   // British male, fits the character
    const blob = await Promise.race([ gen, new Promise((_,rej)=>setTimeout(()=>rej(new Error('kokoro timeout')), 16000)) ]);
    if(!blob) throw new Error('kokoro no audio');
    await playRealAudio(blob);
  }

  // Speak: prefer the smooth Kokoro neural voice (real audio → analyser mouth); if it's not
  // ready or errors/too-slow, fall back to the browser voice (word-boundary mouth).
  async function speak(text){
    if(window.__kokoro && window.__kokoro.ready){
      try{ await speakKokoro(text); return; }
      catch(e){ console.warn('Kokoro speak failed; browser voice:', e); }
    }
    startTalkMouth(lastTimings);
    try{ await speakWithWebSpeech(text); }
    finally{ stopTalkMouth(); }
  }

  async function startGame(e){
    if (e){ e.preventDefault(); e.stopPropagation(); }

    unlockAudio();
    attachAnalyserToMediaElement();

    try{
      const ok = await playClickOrBeep();
      primed = ok;
    }catch(_){ primed=false; }

    // Prevent the intro tap from "falling through" to the door
    gestureGuardUntil = performance.now() + 400;

    if(!intro) return;
    scheduleBlink();

    // Start downloading the neural voice in the background so it's ready by the time he speaks.
    // DESKTOP ONLY: the Kokoro-82M model runs in WASM on phones (no mobile WebGPU), which
    // blows past iOS Safari's per-tab memory cap and crashes the tab. Phones use the browser
    // voice instead (see speak()), which is the intended mobile fallback.
    if(!IS_PHONE){ try{ window.loadKokoro && window.loadKokoro(); }catch(_){} }

    intro.style.transition='opacity .28s ease';
    intro.style.opacity='0';
    setTimeout(()=>{ intro.remove(); gameRoot.removeAttribute('aria-hidden'); showSummon(); }, 280);
  }
  intro.addEventListener('pointerdown', startGame, {passive:false});
  intro.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ startGame(e); }});

  function showQuoteView(){
    ctxWrap.classList.remove('active');
    outputContainer.classList.add('active');
    currentView = 'quote';
    placeBubble(); placeGlasses();
  }
  function showContextView(){
    outputContainer.classList.remove('active');
    ctxWrap.classList.add('active');
    currentView = 'context';
    placeBubble(); placeGlasses();
  }
  function toggleView(){
    if(!lastContextText) return;
    currentView === 'quote' ? showContextView() : showQuoteView();
  }
  glassesBtn.addEventListener('click', toggleView);

  async function summon(ev){
    if (performance.now() < gestureGuardUntil) { ev && ev.preventDefault(); return; }

    unlockAudio();
    if(busy) return;

    // optional click on door
    try{ await playClickOrBeep(); }catch(_){}

    busy=true;
    hideSummon();     // he's coming out — tuck the button away
    lastTimings = []; // clear stale lip-sync track from a previous summon
    ctxWrap.classList.remove('active');
    glassesBtn.classList.remove('show');
    stopAudio(); clearWorkTag();
    openDoor();

    (async ()=>{
      try{
        await new Promise(r=>setTimeout(r, 450)); // brief beat after he appears, then he speaks

        // Phase 1: fast content
        const data = await fetchQuote();

        if(!data || !data.text){
          const fallback = "um. ahhh... it's the funniest thing, I completely forgot what I was about to say. Let me go back inside, eat a peanut butter cup then please click on the door again and I'll be right back.";
          const text = sanitize(fallback);
          typeOut(text, async ()=>{
            placeGlasses();
            await speak(text);
            setTimeout(()=>{ outputContainer.classList.remove('active'); clearWorkTag(); setTimeout(closeDoor, 400); }, 400);
          });
          return;
        }

        const work = data.work || null, author = data.author || null;
        const text = sanitize(data.text);
        lastTimings = Array.isArray(data.timings) ? data.timings : [];
        lastContextText  = (data.context && (data.context.summary||'').trim()) || '';

        // TYPE the quote
        typeOut(text, async ()=>{
          showWork(work, author);
          if(lastContextText){ ctxText.textContent = lastContextText; glassesBtn.classList.add('show'); }
          placeBubble(); placeGlasses();
        });

        // FREE snippet context (Cloudflare Worker → Wikipedia fallback), fetched in background.
        if(!lastContextText){
          (async ()=>{
            const ctx = await fetchSnippetContext(text, work, author);
            if(ctx && busy){ lastContextText = ctx; ctxText.textContent = ctx; glassesBtn.classList.add('show'); placeGlasses(); }
          })();
        }

        // Phase 2: TTS first; fallback to Web Speech if needed (works on iOS)
        (async ()=>{ try{ await speak(text); }catch(_){ } })();

        // Visual closeouts on a timer
        setTimeout(()=>{
          if(currentView==='context'){ ctxWrap.classList.remove('active'); }
          outputContainer.classList.remove('active');
          glassesBtn.classList.remove('show');
          clearWorkTag();
          setTimeout(closeDoor, 500);
        }, Math.max(CTX_LINGER_MS, BUBBLE_LINGER_MS - SHOW_CTX_AFTER_MS));

      }catch(e){
        console.error('summon hard error', e);
        const fallback = "geez I'm sorry I ugh, need a few more seconds. try again and I'll be right back.";
        const text = sanitize(fallback);
        typeOut(text, async ()=>{
          try{ await speak(text); }catch(_){ }
          setTimeout(()=>{ outputContainer.classList.remove('active'); clearWorkTag(); setTimeout(closeDoor, 400); }, 400);
        });
      }
    })();
  }

  doorTrigger.addEventListener('click', summon);
  if(redBtn) redBtn.addEventListener('click', summon);
  doorTrigger.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); summon(e); } });

  // calibration (unchanged)
  const calHud=document.getElementById('calHud'); let calOn=false; const STORAGE_KEY='cc_vars_cuckoo';
  function getVar(name,fallback){ const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)); return isNaN(v)?(fallback??0):v; }
  function setVar(name,value){ document.documentElement.style.setProperty(name,String(value)); persistVars(); positionDoorAndChunklet(); updateHud(); }
  function persistVars(){
    const data={ door_x:getVar('--door-x'), door_y:getVar('--door-y'), door_w:getVar('--door-w'), door_h:getVar('--door-h'),
      mouth_top:getComputedStyle(document.documentElement).getPropertyValue('--mouth-top'),
      mouth_left:getComputedStyle(document.documentElement).getPropertyValue('--mouth-left'),
      eye_top:getComputedStyle(document.documentElement).getPropertyValue('--eye-top'),
      eye_gap:getComputedStyle(document.documentElement).getPropertyValue('--eye-gap'),
      eye_size:getComputedStyle(document.documentElement).getPropertyValue('--eye-size') };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }
  function loadVars(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return;
      const d=JSON.parse(raw);
      if(d.door_x) document.documentElement.style.setProperty('--door-x', d.door_x);
      if(d.door_y) document.documentElement.style.setProperty('--door-y', d.door_y);
      if(d.door_w) document.documentElement.style.setProperty('--door-w', d.door_w);
      if(d.door_h) document.documentElement.style.setProperty('--door-h', d.door_h);
      if(d.mouth_top)  document.documentElement.style.setProperty('--mouth-top', d.mouth_top);
      if(d.mouth_left) document.documentElement.style.setProperty('--mouth-left', d.mouth_left);
      if(d.eye_top)  document.documentElement.style.setProperty('--eye-top', d.eye_top);
      if(d.eye_gap)  document.documentElement.style.setProperty('--eye-gap', d.eye_gap);
      if(d.eye_size) document.documentElement.style.setProperty('--eye-size', d.eye_size);
    }catch(_){}
  }
  function updateHud(){
    if(!calOn) return;
    const door={ x:getVar('--door-x').toFixed(3), y:getVar('--door-y').toFixed(3), w:getVar('--door-w').toFixed(3), h:getVar('--door-h').toFixed(3) };
    const mTop=getComputedStyle(document.documentElement).getPropertyValue('--mouth-top').trim();
    const mLeft=getComputedStyle(document.documentElement).getPropertyValue('--mouth-left').trim();
    const eTop=getComputedStyle(document.documentElement).getPropertyValue('--eye-top').trim();
    const eGap=getComputedStyle(document.documentElement).getPropertyValue('--eye-gap').trim();
    const eSize=getComputedStyle(document.documentElement).getPropertyValue('--eye-size').trim();
    calHud.textContent=
`CALIBRATION — Shift=fine
Door  x:${door.x}  y:${door.y}  w:${door.w}  h:${door.h}
Mouth top:${mTop}  left:${mLeft}
Eyes top:${eTop}  gap:${eGap}  size:${eSize}
C=toggle  R=reset`;
  }
  function toggleCal(){ calOn=!calOn; calHud.classList.toggle('on', calOn); updateHud(); }
  function resetSaved(){ localStorage.removeItem(STORAGE_KEY); location.reload(); }
  loadVars();
  window.addEventListener('keydown', (e)=>{
    if(e.key==='c'||e.key==='C'){ toggleCal(); return; }
    if(!calOn) return;
    if(e.key==='r'||e.key==='R'){ resetSaved(); return; }
  });

  positionDoorAndChunklet();
})();
</script>
</body>
</html>
